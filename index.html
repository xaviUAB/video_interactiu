<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Vídeo Interactiu - Gamelab UAB</title>
    
    <!-- Estils Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel per processar JSX al navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- YouTube IFrame API (Nativa) -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        body { background-color: #111827; color: white; overflow: hidden; margin: 0; }
        /* Scrollbars personalitzades */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        #root:empty::before {
            content: 'Carregant editor...';
            display: flex;
            height: 100vh;
            width: 100vw;
            align-items: center;
            justify-content: center;
            color: #6b7280;
        }

        /* Tooltip style */
        .hotspot-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            white-space: nowrap;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -8px;
        }

        /* Responsive Video Wrapper */
        #video-wrapper {
            position: relative;
            margin: auto;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Play, Pause, Plus, Trash2, Save, Layout, 
          Type, Clock, Palette, MonitorPlay, Settings,
          ChevronRight, ArrowRightCircle, Image as ImageIcon,
          Network, Upload, FileVideo, Move, X, Maximize,
          GripHorizontal, Scaling, MousePointer2,
          Download, FolderOpen, Flag, PlayCircle,
          Copy, Clipboard, AlertCircle, Ghost, Film, FileUp, AlertTriangle, CheckCircle, Youtube,
          Database, Zap, Eye, EyeOff, Layers, Package, Lock,
          Undo, Redo, MapPin, Target, Image, GripVertical, Bold, Italic, StepForward,
          ZoomIn, ZoomOut, Compass, CircleDot, Info
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- Utilitats ---
        const hexToRgba = (hex, alpha = 1) => {
          if (hex && typeof hex === 'string' && (hex.startsWith('rgba') || hex.startsWith('rgb'))) return hex;
          let r = 0, g = 0, b = 0;
          if (!hex) return `rgba(0,0,0,${alpha})`;
          if (hex.length === 4) {
            r = parseInt(hex[1] + hex[1], 16);
            g = parseInt(hex[2] + hex[2], 16);
            b = parseInt(hex[3] + hex[3], 16);
          } else if (hex.length === 7) {
            r = parseInt(hex[1] + hex[2], 16);
            g = parseInt(hex[3] + hex[4], 16);
            b = parseInt(hex[5] + hex[6], 16);
          }
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        const hexToRgbArr = (hex) => {
            let h = (hex || '#000000').replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
        };

        const interpolateColor = (hex1, hex2, prog) => {
            const [r1, g1, b1] = hexToRgbArr(hex1);
            const [r2, g2, b2] = hexToRgbArr(hex2);
            return `rgb(${Math.round(r1 + (r2 - r1) * prog)}, ${Math.round(g1 + (g2 - g1) * prog)}, ${Math.round(b1 + (b2 - b1) * prog)})`;
        };

        const interpolateRgba = (hex1, op1, hex2, op2, prog) => {
            const [r1, g1, b1] = hexToRgbArr(hex1);
            const [r2, g2, b2] = hexToRgbArr(hex2);
            const a = op1 + (op2 - op1) * prog;
            return `rgba(${Math.round(r1 + (r2 - r1) * prog)}, ${Math.round(g1 + (g2 - g1) * prog)}, ${Math.round(b1 + (b2 - b1) * prog)}, ${a})`;
        };

        const getContrastYIQ = (hexcolor) => {
            if (!hexcolor) return 'white';
            if (hexcolor.startsWith('#')) hexcolor = hexcolor.substring(1);
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(c => c + c).join('');
            const r = parseInt(hexcolor.substr(0, 2), 16);
            const g = parseInt(hexcolor.substr(2, 2), 16);
            const b = parseInt(hexcolor.substr(4, 2), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? 'black' : 'white';
        };

        const getVideoSrc = (url) => {
            if (!url) return '';
            if (url.match(/^(http|https|blob):/) || url.startsWith('www.')) return url;
            if (url.startsWith('videos/')) return url;
            return `videos/${url}`;
        };

        const getYoutubeId = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const isImageFile = (url) => {
            if (!url) return false;
            return /\.(jpg|jpeg|png|gif|webp)$/i.test(url) || url.startsWith('data:image');
        };

        // --- LÒGICA D'INTERPOLACIÓ DE KEYFRAMES (POSICIÓ + MIDA + COLOR) ---
        const getInterpolatedStyle = (opt, currentTime) => {
            if (!opt.useKeyframes || !opt.keyframes || opt.keyframes.length === 0) {
                return opt.style;
            }
            const sortedKeys = [...opt.keyframes].sort((a, b) => a.time - b.time);
            const getVal = (k, prop) => k[prop] !== undefined ? k[prop] : opt.style[prop];

            if (currentTime <= sortedKeys[0].time) {
                const k = sortedKeys[0];
                return { 
                    ...opt.style, 
                    left: k.left, top: k.top, width: getVal(k, 'width'), height: getVal(k, 'height'),
                    backgroundColor: getVal(k, 'backgroundColor'), color: getVal(k, 'color'), bgOpacity: getVal(k, 'bgOpacity')
                };
            }
            if (currentTime >= sortedKeys[sortedKeys.length - 1].time) {
                const last = sortedKeys[sortedKeys.length - 1];
                return { 
                    ...opt.style, 
                    left: last.left, top: last.top, width: getVal(last, 'width'), height: getVal(last, 'height'),
                    backgroundColor: getVal(last, 'backgroundColor'), color: getVal(last, 'color'), bgOpacity: getVal(last, 'bgOpacity')
                };
            }
            for (let i = 0; i < sortedKeys.length - 1; i++) {
                const k1 = sortedKeys[i];
                const k2 = sortedKeys[i + 1];
                if (currentTime >= k1.time && currentTime < k2.time) {
                    const range = k2.time - k1.time;
                    const progress = (currentTime - k1.time) / range;
                    
                    const l1 = k1.left, l2 = k2.left;
                    const t1 = k1.top, t2 = k2.top;
                    const w1 = getVal(k1, 'width'), w2 = getVal(k2, 'width');
                    const h1 = getVal(k1, 'height'), h2 = getVal(k2, 'height');

                    const bg1 = getVal(k1, 'backgroundColor'), bg2 = getVal(k2, 'backgroundColor');
                    const op1 = getVal(k1, 'bgOpacity') !== undefined ? getVal(k1, 'bgOpacity') : 1;
                    const op2 = getVal(k2, 'bgOpacity') !== undefined ? getVal(k2, 'bgOpacity') : 1;
                    const c1 = getVal(k1, 'color'), c2 = getVal(k2, 'color');

                    return { 
                        ...opt.style, 
                        left: l1 + (l2 - l1) * progress, 
                        top: t1 + (t2 - t1) * progress, 
                        width: w1 + (w2 - w1) * progress, 
                        height: h1 + (h2 - h1) * progress,
                        backgroundColor: interpolateRgba(bg1, op1, bg2, op2, progress),
                        color: interpolateColor(c1, c2, progress),
                        bgOpacity: 1 // Ja fusionat a backgroundColor
                    };
                }
            }
            return opt.style;
        };

        // --- LÒGICA D'INTERPOLACIÓ DE LÍNIES (Catmull-Rom Spline) ---
        const generateSmoothPath = (startX, startY, endX, endY, controlPoints) => {
            if (!controlPoints || controlPoints.length === 0) {
                const distanceX = Math.abs(endX - startX);
                let cpOffset = Math.max(distanceX / 2, 100);
                if (endX < startX + 50) {
                    cpOffset = Math.max(distanceX, 200); 
                }
                return `M ${startX} ${startY} C ${startX + cpOffset} ${startY}, ${endX - cpOffset} ${endY}, ${endX} ${endY}`;
            } else {
                let d = `M ${startX} ${startY}`;
                const points = [ {x: startX, y: startY}, ...controlPoints, {x: endX, y: endY} ];
                
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    
                    let cp1X, cp1Y, cp2X, cp2Y;
                    
                    if (i === 0) {
                        cp1X = p1.x + Math.max((p2.x - p1.x) / 2, 50);
                        cp1Y = p1.y;
                    } else {
                        cp1X = p1.x + (p2.x - p1.x) / 2;
                        cp1Y = p1.y;
                    }
                    
                    if (i === points.length - 2) {
                        cp2X = p2.x - Math.max((p2.x - p1.x) / 2, 50);
                        cp2Y = p2.y;
                    } else {
                        cp2X = p1.x + (p2.x - p1.x) / 2;
                        cp2Y = p2.y;
                    }
                    
                    d += ` C ${cp1X} ${cp1Y}, ${cp2X} ${cp2Y}, ${p2.x} ${p2.y}`;
                }
                return d;
            }
        };

        const loadJSZip = () => {
          return new Promise((resolve, reject) => {
            if (window.JSZip) return resolve(window.JSZip);
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
            script.onload = () => resolve(window.JSZip);
            script.onerror = reject;
            document.head.appendChild(script);
          });
        };

        const INITIAL_NODES = [];

        // --- Component de Gràfic ---
        const NodeGraph = ({ 
          nodes, onUpdateNode, onSelectNode, onDeleteNode, startNodeId, onSetStartNode, onPreviewNode, onUpdateOption 
        }) => {
          const [draggingNodeId, setDraggingNodeId] = useState(null);
          const [draggingControlPoint, setDraggingControlPoint] = useState(null); 
          const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
          const [viewport, setViewport] = useState({ x: 0, y: 0, zoom: 1 });
          const [isPanning, setIsPanning] = useState(false);
          const [lastMousePos, setLastMousePos] = useState({ x: 0, y: 0 });

          const containerRef = useRef(null);

          const screenToWorld = useCallback((clientX, clientY) => {
              if (!containerRef.current) return { x: 0, y: 0 };
              const rect = containerRef.current.getBoundingClientRect();
              return {
                  x: (clientX - rect.left - viewport.x) / viewport.zoom,
                  y: (clientY - rect.top - viewport.y) / viewport.zoom
              };
          }, [viewport]);

          const handleWheel = useCallback((e) => {
              e.preventDefault();
              if (!containerRef.current) return;
              const rect = containerRef.current.getBoundingClientRect();
              const mouseX = e.clientX - rect.left;
              const mouseY = e.clientY - rect.top;
              const zoomIntensity = 0.1;
              const direction = Math.sign(e.deltaY);
              const newZoom = Math.min(Math.max(0.2, viewport.zoom - direction * zoomIntensity), 4);
              const worldX = (mouseX - viewport.x) / viewport.zoom;
              const worldY = (mouseY - viewport.y) / viewport.zoom;
              const newX = mouseX - worldX * newZoom;
              const newY = mouseY - worldY * newZoom;
              setViewport({ x: newX, y: newY, zoom: newZoom });
          }, [viewport]);

          const handleAddControlPoint = (e, nodeId, optionId) => {
              e.stopPropagation();
              e.preventDefault();
              const worldPos = screenToWorld(e.clientX, e.clientY);
              const node = nodes.find(n => n.id === nodeId);
              const option = node.options.find(o => o.id === optionId);
              const currentPoints = option.controlPoints || [];
              const newPoints = [...currentPoints, { id: Date.now(), x: worldPos.x, y: worldPos.y }];
              onUpdateOption(nodeId, optionId, 'controlPoints', newPoints);
          };

          const handleRemoveControlPoint = (e, nodeId, optionId, index) => {
              e.stopPropagation();
              e.preventDefault();
              const node = nodes.find(n => n.id === nodeId);
              const option = node.options.find(o => o.id === optionId);
              const newPoints = [...(option.controlPoints || [])];
              newPoints.splice(index, 1);
              onUpdateOption(nodeId, optionId, 'controlPoints', newPoints);
          };

          const handleControlPointMouseDown = (e, nodeId, optionId, index) => {
              e.stopPropagation();
              setDraggingControlPoint({ nodeId, optionId, index });
          };

          const handleMouseDown = (e, nodeId = null) => {
            if (e.button === 1 || e.shiftKey) { 
                 e.preventDefault();
                 setIsPanning(true);
                 setLastMousePos({ x: e.clientX, y: e.clientY });
                 return;
            }

            if (nodeId) {
                e.stopPropagation(); 
                const node = nodes.find(n => n.id === nodeId);
                if (!node) return;
                const worldPos = screenToWorld(e.clientX, e.clientY);
                setDragOffset({ 
                    x: worldPos.x - (node.position?.x || 0), 
                    y: worldPos.y - (node.position?.y || 0) 
                });
                setDraggingNodeId(nodeId);
            } else {
                setIsPanning(true);
                setLastMousePos({ x: e.clientX, y: e.clientY });
            }
          };

          const handleMouseMove = useCallback((e) => {
            if (isPanning) {
                const dx = e.clientX - lastMousePos.x;
                const dy = e.clientY - lastMousePos.y;
                setViewport(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
                setLastMousePos({ x: e.clientX, y: e.clientY });
            } else if (draggingNodeId) {
                const worldPos = screenToWorld(e.clientX, e.clientY);
                const newX = worldPos.x - dragOffset.x;
                const newY = worldPos.y - dragOffset.y;
                onUpdateNode(draggingNodeId, 'position', { x: newX, y: newY });
            } else if (draggingControlPoint) {
                const worldPos = screenToWorld(e.clientX, e.clientY);
                const { nodeId, optionId, index } = draggingControlPoint;
                const node = nodes.find(n => n.id === nodeId);
                const option = node.options.find(o => o.id === optionId);
                const newPoints = [...(option.controlPoints || [])];
                
                if (newPoints[index]) {
                    newPoints[index] = { ...newPoints[index], x: worldPos.x, y: worldPos.y };
                    onUpdateOption(nodeId, optionId, 'controlPoints', newPoints);
                }
            }
          }, [isPanning, draggingNodeId, draggingControlPoint, lastMousePos, dragOffset, onUpdateNode, onUpdateOption, screenToWorld, nodes]);

          const handleMouseUp = () => {
              setDraggingNodeId(null);
              setIsPanning(false);
              setDraggingControlPoint(null);
          };

          useEffect(() => {
            if (draggingNodeId || isPanning || draggingControlPoint) {
              window.addEventListener('mousemove', handleMouseMove);
              window.addEventListener('mouseup', handleMouseUp);
            } else {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            }
            return () => {
              window.removeEventListener('mousemove', handleMouseMove);
              window.removeEventListener('mouseup', handleMouseUp);
            };
          }, [draggingNodeId, isPanning, draggingControlPoint, handleMouseMove]);

          const zoomIn = () => setViewport(prev => ({ ...prev, zoom: Math.min(prev.zoom + 0.2, 4) }));
          const zoomOut = () => setViewport(prev => ({ ...prev, zoom: Math.max(prev.zoom - 0.2, 0.2) }));
          const resetView = () => setViewport({ x: 0, y: 0, zoom: 1 });

          return (
            <div 
                ref={containerRef} 
                className="flex-1 bg-gray-950 overflow-hidden relative min-h-full cursor-crosshair select-none" 
                onWheel={handleWheel}
                onMouseDown={(e) => handleMouseDown(e, null)}
                style={{
                    backgroundImage: 'radial-gradient(#374151 1px, transparent 1px)', 
                    backgroundSize: `${20 * viewport.zoom}px ${20 * viewport.zoom}px`,
                    backgroundPosition: `${viewport.x}px ${viewport.y}px`
                }}
            >
              <div style={{ transform: `translate(${viewport.x}px, ${viewport.y}px) scale(${viewport.zoom})`, transformOrigin: '0 0', width: '100%', height: '100%' }}>
                {nodes.length === 0 && (
                    <div className="absolute top-20 left-20 text-gray-500 flex flex-col items-center pointer-events-none transform scale-100 origin-top-left">
                        <Network size={64} className="mb-4 opacity-20"/>
                        <p className="text-xl font-semibold opacity-40">Llenç buit</p>
                    </div>
                )}
                
                <svg className="absolute top-0 left-0 w-full h-full overflow-visible pointer-events-none z-0" style={{ overflow: 'visible' }}>
                  <defs><marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 L2,2" fill="#6b7280" /></marker></defs>
                  {nodes.map(node => {
                    const optionLinks = node.options.map((opt, idx) => {
                        if (!opt.targetNodeId || opt.url) return null; 
                        const targetNode = nodes.find(n => n.id === opt.targetNodeId);
                        if (!targetNode) return null;
                        
                        const isConditional = (opt.condition && opt.condition.variable) || opt.singleUse;
                        const dashArray = isConditional ? "5,5" : "0";

                        const startX = (node.position?.x || 0) + 280;
                        const startY = (node.position?.y || 0) + 116 + (idx * 36);
                        const endX = targetNode.position?.x || 0;
                        const endY = (targetNode.position?.y || 0) + 20;

                        const pathString = generateSmoothPath(startX, startY, endX, endY, opt.controlPoints);
                        
                        return (
                            <g key={opt.id} className="group-link">
                                <path 
                                    d={pathString} 
                                    stroke="transparent" 
                                    strokeWidth="20" 
                                    fill="none" 
                                    className="pointer-events-auto cursor-crosshair"
                                    onDoubleClick={(e) => handleAddControlPoint(e, node.id, opt.id)}
                                />
                                <path 
                                    d={pathString} 
                                    stroke={node.color || '#4b5563'} 
                                    strokeWidth="3" 
                                    fill="none" 
                                    markerEnd="url(#arrowhead)" 
                                    className="opacity-60 pointer-events-none" 
                                    strokeDasharray={dashArray}
                                />
                                {opt.controlPoints && opt.controlPoints.map((cp, i) => (
                                    <circle 
                                        key={i}
                                        cx={cp.x} 
                                        cy={cp.y} 
                                        r={6 / viewport.zoom}
                                        fill="white" 
                                        stroke="#3b82f6"
                                        strokeWidth="2"
                                        className="pointer-events-auto cursor-move"
                                        onMouseDown={(e) => handleControlPointMouseDown(e, node.id, opt.id, i)}
                                        onDoubleClick={(e) => handleRemoveControlPoint(e, node.id, opt.id, i)}
                                    />
                                ))}
                            </g>
                        );
                    });

                    let autoNavLink = null;
                    if (node.defaultNextNodeId) {
                        const targetNode = nodes.find(n => n.id === node.defaultNextNodeId);
                        if (targetNode) {
                            const startX = (node.position?.x || 0) + 280;
                            const startY = (node.position?.y || 0) + 116 + (node.options.length * 36) + 16;
                            const endX = targetNode.position?.x || 0;
                            const endY = (targetNode.position?.y || 0) + 20;
                            
                            const pathString = generateSmoothPath(startX, startY, endX, endY, []);
                            
                            autoNavLink = (
                                <path 
                                    key={`auto-${node.id}`} 
                                    d={pathString} 
                                    stroke="white" 
                                    strokeWidth="2" 
                                    fill="none" 
                                    markerEnd="url(#arrowhead)" 
                                    className="opacity-40" 
                                    strokeDasharray="4,4"
                                />
                            );
                        }
                    }

                    return (
                        <React.Fragment key={node.id}>
                            {optionLinks}
                            {autoNavLink}
                        </React.Fragment>
                    );
                  })}
                </svg>

                {nodes.map(node => {
                  const textColor = getContrastYIQ(node.color || '#374151');
                  const iconColor = textColor === 'black' ? 'text-black/60 hover:text-black' : 'text-white/60 hover:text-white';
                  const titleColor = textColor === 'black' ? 'text-black' : 'text-white';

                  return (
                  <div 
                    key={node.id} 
                    className="absolute w-[280px] bg-gray-800 rounded-lg shadow-2xl border border-gray-700 flex flex-col z-10 group" 
                    style={{ left: node.position?.x || 0, top: node.position?.y || 0 }}
                  >
                    <div className="absolute left-0 top-[20px] w-3 h-3 bg-gray-400 rounded-full transform -translate-x-1.5 -translate-y-1.5 border-2 border-gray-800 z-20"></div>
                    <div className="h-10 rounded-t-lg flex items-center justify-between px-3 cursor-move select-none" style={{ backgroundColor: node.color || '#374151' }} onMouseDown={(e) => handleMouseDown(e, node.id)}>
                      <div className={`flex items-center gap-2 ${titleColor} font-bold text-sm truncate max-w-[140px]`}><Move size={14} className="opacity-50" /><span className="truncate">{node.title}</span></div>
                      <div className="flex items-center gap-1">
                        <button onClick={(e) => { e.stopPropagation(); onPreviewNode(node.id); }} className={`${iconColor} p-1 hover:bg-black/10 rounded`} title="Previsualitzar"><PlayCircle size={14} /></button>
                        <button onClick={(e) => { e.stopPropagation(); onSetStartNode(node.id); }} className={`p-1 rounded hover:bg-black/10 ${startNodeId === node.id ? (textColor==='black'?'text-green-700':'text-green-400') : iconColor}`} title="Marcar inici"><Flag size={14} fill={startNodeId === node.id ? "currentColor" : "none"}/></button>
                        <div className={`w-px h-4 mx-1 ${textColor === 'black' ? 'bg-black/20' : 'bg-white/20'}`}></div>
                        
                        <div className={`relative flex items-center justify-center p-1 rounded hover:bg-black/10 transition-colors cursor-pointer ${iconColor}`} title="Canviar color d'escena">
                            <Palette size={14} />
                            <input type="color" value={node.color || '#374151'} onChange={(e) => onUpdateNode(node.id, 'color', e.target.value)} className="absolute opacity-0 w-full h-full cursor-pointer left-0 top-0" />
                        </div>

                        <button onClick={(e) => { e.stopPropagation(); onDeleteNode(node.id); }} className={`${iconColor} hover:text-red-500 rounded p-1 transition-colors`}><X size={14} /></button>
                      </div>
                    </div>
                    <div className="p-3 space-y-3 bg-gray-800 rounded-b-lg">
                      <input type="text" value={node.title} onChange={(e) => onUpdateNode(node.id, 'title', e.target.value)} className="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200 outline-none" placeholder="Títol..." />
                      <div className="space-y-1">
                        <div className="flex justify-between items-center text-[10px] text-gray-500 uppercase tracking-wider font-semibold"><span>Opcions ({node.options.length})</span><button onClick={() => addOptionToNode(node.id)} className="hover:text-blue-400"><Plus size={12} /></button></div>
                        {node.options.map((opt) => (
                          <div key={opt.id} className="flex items-center gap-1 bg-gray-900 p-1.5 rounded border border-gray-700 relative">
                            <div className="absolute right-0 top-1/2 w-2 h-2 bg-blue-500 rounded-full transform translate-x-1 -translate-y-1/2 z-20"></div>
                            <input type="text" value={opt.label} onChange={(e) => updateNodeOption(node.id, opt.id, 'label', e.target.value)} className="w-24 bg-transparent border-none text-xs text-white p-0 truncate font-medium" />
                            <div className="flex gap-0.5">
                                {opt.singleUse && <Ghost size={10} className="text-purple-400" title="Un sol ús"/>}
                                {opt.condition && opt.condition.variable && <Lock size={10} className="text-yellow-400" title={`Condició: ${opt.condition.variable}`}/>}
                                {opt.effects && opt.effects.length > 0 && <Zap size={10} className="text-blue-400" title="Canvi variable"/>}
                                {opt.useKeyframes && <MapPin size={10} className="text-orange-400" title="Animació"/>}
                            </div>
                            <ArrowRightCircle size={12} className="text-gray-500 shrink-0" />
                            {opt.url !== undefined && opt.url !== "" ? (
                                <input type="text" value={opt.url} onChange={(e) => updateNodeOption(node.id, opt.id, 'url', e.target.value)} className="flex-1 bg-gray-800 border-none text-[10px] text-blue-400 rounded py-0.5 px-1 h-5" placeholder="URL" />
                            ) : (
                                <select value={opt.targetNodeId || ""} onChange={(e) => updateNodeOption(node.id, opt.id, 'targetNodeId', e.target.value)} className="flex-1 bg-gray-800 text-[10px] text-gray-300 border-none rounded py-0.5 px-1 h-5 cursor-pointer">
                                    <option value="">Text</option>
                                    {nodes.map(n => <option key={n.id} value={n.id}>{n.title}</option>)}
                                    {opt.targetNodeId && !nodes.find(n => n.id === opt.targetNodeId) && <option value={opt.targetNodeId} disabled>Destí esborrat</option>}
                                </select>
                            )}
                            <button onClick={() => deleteNodeOption(node.id, opt.id)} className="text-gray-600 hover:text-red-400"><Trash2 size={12} /></button>
                          </div>
                        ))}
                      </div>
                      <button onClick={() => { onSelectNode(node.id); }} className="w-full mt-2 py-1 bg-gray-700 hover:bg-gray-600 text-xs text-gray-300 rounded flex items-center justify-center gap-2"><Settings size={12} /> Editar</button>
                    </div>
                  </div>
                )})}
              </div>

              <div className="absolute bottom-6 right-6 flex flex-col gap-2 z-50">
                  <button onClick={zoomIn} className="p-2 bg-gray-800 hover:bg-gray-700 text-white rounded shadow border border-gray-600" title="Zoom In"><ZoomIn size={20}/></button>
                  <button onClick={zoomOut} className="p-2 bg-gray-800 hover:bg-gray-700 text-white rounded shadow border border-gray-600" title="Zoom Out"><ZoomOut size={20}/></button>
                  <button onClick={resetView} className="p-2 bg-gray-800 hover:bg-gray-700 text-white rounded shadow border border-gray-600" title="Centrar / Reset"><Compass size={20}/></button>
              </div>
            </div>
          );
        };
        
        function App() {
          const [nodes, setNodes] = useState(() => {
            const saved = localStorage.getItem('intervideo_project');
            return saved ? JSON.parse(saved).nodes : INITIAL_NODES;
          });
          const [variables, setVariables] = useState(() => {
            const saved = localStorage.getItem('intervideo_project');
            return saved ? JSON.parse(saved).variables || [] : [];
          });
          const [selectedNodeId, setSelectedNodeId] = useState(null);
          const [startNodeId, setStartNodeId] = useState(() => {
            const saved = localStorage.getItem('intervideo_project');
            return saved ? JSON.parse(saved).startNodeId : null;
          });
          const [mode, setMode] = useState('edit'); 
          const [currentNodeId, setCurrentNodeId] = useState(null); 
          const [selectedOptionId, setSelectedOptionId] = useState(null);
          const [hoveredOptionId, setHoveredOptionId] = useState(null); 
          const [draggedSceneIdx, setDraggedSceneIdx] = useState(null);
          
          const [isPlaying, setIsPlaying] = useState(false);
          const [currentTime, setCurrentTime] = useState(0);
          const [duration, setDuration] = useState(0); 
          const [videoError, setVideoError] = useState(null);
          const [fileBlobs, setFileBlobs] = useState({}); 
          const [videosLoadedCount, setVideosLoadedCount] = useState(0); 
          
          const [videoDimensions, setVideoDimensions] = useState({ width: 0, height: 0 });
          const [mediaAspectRatio, setMediaAspectRatio] = useState(16 / 9);

          const [clickedOptions, setClickedOptions] = useState(new Set()); 
          const [runtimeVariables, setRuntimeVariables] = useState({}); 
          const [showMissingFilesModal, setShowMissingFilesModal] = useState(false); 
          const [showLoadModal, setShowLoadModal] = useState(false); 
          const [showVariablesModal, setShowVariablesModal] = useState(false);
          const [showDeleteModal, setShowDeleteModal] = useState(false);
          const [showInfoModal, setShowInfoModal] = useState(false);
          const [nodeToDelete, setNodeToDelete] = useState(null);
          
          const [isTransitioning, setIsTransitioning] = useState(false);
          const [activeTab, setActiveTab] = useState('properties'); 

          const [dragState, setDragState] = useState({ isDragging: false, type: null, targetId: null, startX: 0, startY: 0, initialVal: {} });
          const [clipboardStyle, setClipboardStyle] = useState(null);

          const historyRef = useRef({ past: [], future: [] });

          const videoRef = useRef(null);
          const ytPlayerRef = useRef(null);
          const videoContainerRef = useRef(null);
          const videoWrapperRef = useRef(null); 
          const timelineTrackRef = useRef(null); 
          const fileInputRef = useRef(null);
          const projectInputRef = useRef(null); 
          const bulkVideoInputRef = useRef(null); 
          const requestRef = useRef();
          const lastTimeRef = useRef(Date.now()); 

          const activeNodeId = mode === 'preview' ? currentNodeId : selectedNodeId;
          const activeNode = nodes.find(n => n.id === activeNodeId); 
          const youtubeId = activeNode ? getYoutubeId(activeNode.videoUrl) : null;
          const isImage = activeNode ? isImageFile(activeNode.videoUrl) : false;

          useEffect(() => {
            const projectData = { nodes, variables, startNodeId };
            localStorage.setItem('intervideo_project', JSON.stringify(projectData));
          }, [nodes, variables, startNodeId]);

          const handleUpdateOption = (nodeId, optionId, field, value) => {
               setNodes(prev => prev.map(n => {
                  if (n.id === nodeId) {
                      return {
                          ...n,
                          options: n.options.map(o => o.id === optionId ? { ...o, [field]: value } : o)
                      };
                  }
                  return n;
              }));
          };

          useEffect(() => {
              if (youtubeId) setMediaAspectRatio(16 / 9);
          }, [youtubeId]);

          // --- RESPONSIVE VIDEO SIZE ---
          useEffect(() => {
              const container = videoContainerRef.current;
              if (!container) return;

              const handleResize = () => {
                  const cw = container.clientWidth;
                  const ch = container.clientHeight;
                  if (cw === 0 || ch === 0) return;
                  
                  const cr = cw / ch;
                  let finalW, finalH;
                  
                  if (cr > mediaAspectRatio) { 
                      finalH = ch; 
                      finalW = ch * mediaAspectRatio; 
                  } else { 
                      finalW = cw; 
                      finalH = cw / mediaAspectRatio; 
                  }
                  
                  setVideoDimensions({ width: finalW, height: finalH });
              };

              const resizeObserver = new ResizeObserver(handleResize);
              resizeObserver.observe(container);
              handleResize(); 

              return () => resizeObserver.disconnect();
          }, [mediaAspectRatio, mode, activeNodeId]);

          const saveHistory = () => {
            historyRef.current.past.push({ 
                nodes: JSON.parse(JSON.stringify(nodes)), 
                variables: JSON.parse(JSON.stringify(variables)), 
                startNodeId 
            });
            if (historyRef.current.past.length > 50) historyRef.current.past.shift();
            historyRef.current.future = [];
          };

          const undo = useCallback(() => {
            if (historyRef.current.past.length === 0) return;
            const previous = historyRef.current.past.pop();
            historyRef.current.future.push({ 
                nodes: JSON.parse(JSON.stringify(nodes)), 
                variables: JSON.parse(JSON.stringify(variables)), 
                startNodeId 
            });
            setNodes(previous.nodes);
            setVariables(previous.variables);
            setStartNodeId(previous.startNodeId);
          }, [nodes, variables, startNodeId]);

          const redo = useCallback(() => {
            if (historyRef.current.future.length === 0) return;
            const next = historyRef.current.future.pop();
            historyRef.current.past.push({ 
                nodes: JSON.parse(JSON.stringify(nodes)), 
                variables: JSON.parse(JSON.stringify(variables)), 
                startNodeId 
            });
            setNodes(next.nodes);
            setVariables(next.variables);
            setStartNodeId(next.startNodeId);
          }, [nodes, variables, startNodeId]);

          const handleSceneDragStart = (e, index) => {
              e.dataTransfer.effectAllowed = 'move';
              setDraggedSceneIdx(index);
          };

          const handleSceneDrop = (e, index) => {
              e.preventDefault();
              if (draggedSceneIdx === null || draggedSceneIdx === index) return;
              saveHistory();
              const newNodes = [...nodes];
              const [removed] = newNodes.splice(draggedSceneIdx, 1);
              newNodes.splice(index, 0, removed);
              setNodes(newNodes);
              setDraggedSceneIdx(null);
          };

          const animate = () => {
             const now = Date.now();
             const dt = (now - lastTimeRef.current) / 1000;
             lastTimeRef.current = now;

             if (videoRef.current && !videoRef.current.paused && !videoRef.current.ended && !youtubeId) {
                 setCurrentTime(videoRef.current.currentTime);
             } else if (youtubeId && ytPlayerRef.current && ytPlayerRef.current.getPlayerState) {
                 const state = ytPlayerRef.current.getPlayerState();
                 if (state === 1) { 
                     setCurrentTime(ytPlayerRef.current.getCurrentTime());
                 }
             } else if (isPlaying && isImage) {
                 setCurrentTime(prev => {
                     const next = prev + dt;
                     const imgDur = activeNode?.duration || 10;
                     if (next >= imgDur && mode === 'preview') return imgDur;
                     return next >= imgDur ? imgDur : next; 
                 });
             }
             requestRef.current = requestAnimationFrame(animate);
          };

          useEffect(() => {
              requestRef.current = requestAnimationFrame(animate);
              return () => cancelAnimationFrame(requestRef.current);
          }, [isPlaying, isImage, mode, activeNode, youtubeId]); 

          const togglePlay = useCallback(() => {
              if (youtubeId && ytPlayerRef.current && ytPlayerRef.current.getPlayerState) {
                  const state = ytPlayerRef.current.getPlayerState();
                  if (state === 1) {
                      ytPlayerRef.current.pauseVideo();
                      setIsPlaying(false);
                  } else {
                      ytPlayerRef.current.playVideo();
                      setIsPlaying(true);
                  }
                  return;
              }
              if (isImage) {
                  setIsPlaying(p => !p);
                  return;
              }
              if (videoRef.current) {
                  if (videoRef.current.paused) {
                      const playPromise = videoRef.current.play();
                      if (playPromise !== undefined) {
                          playPromise.then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
                      }
                  } else {
                      videoRef.current.pause();
                      setIsPlaying(false);
                  }
              }
          }, [youtubeId, isImage]);

          useEffect(() => {
            const handleKeyDown = (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redo(); else undo();
                    return;
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                    e.preventDefault();
                    redo();
                    return;
                }
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
                
                if (e.code === 'ArrowLeft' && !e.shiftKey) {
                    e.preventDefault();
                    if (youtubeId && ytPlayerRef.current && ytPlayerRef.current.seekTo) {
                        const newT = Math.max(0, ytPlayerRef.current.getCurrentTime() - 0.1);
                        ytPlayerRef.current.seekTo(newT, true);
                        setCurrentTime(newT);
                    }
                    else if (isImage) setCurrentTime(t => Math.max(0, t - 0.1));
                    else if (videoRef.current) videoRef.current.currentTime = Math.max(0, videoRef.current.currentTime - 0.1);
                }
                if (e.code === 'ArrowRight' && !e.shiftKey) {
                    e.preventDefault();
                    if (youtubeId && ytPlayerRef.current && ytPlayerRef.current.seekTo) {
                        const newT = Math.min(duration, ytPlayerRef.current.getCurrentTime() + 0.1);
                        ytPlayerRef.current.seekTo(newT, true);
                        setCurrentTime(newT);
                    }
                    else if (isImage) setCurrentTime(t => Math.min(duration, t + 0.1));
                    else if (videoRef.current) videoRef.current.currentTime = Math.min(duration, videoRef.current.currentTime + 0.1);
                }

                if (e.code === 'Delete' || e.code === 'Backspace') {
                    if (mode === 'graph' && selectedNodeId) {
                        setNodeToDelete(selectedNodeId);
                        setShowDeleteModal(true);
                    } else if (mode === 'edit' && selectedOptionId && activeNode) {
                        saveHistory();
                        const newOptions = activeNode.options.filter(o => o.id !== selectedOptionId);
                        updateNode(activeNode.id, 'options', newOptions);
                        setSelectedOptionId(null);
                    }
                }
                
                if (mode === 'edit' && selectedOptionId && activeNode && e.shiftKey) {
                    const opt = activeNode.options.find(o => o.id === selectedOptionId);
                    if (opt) {
                        e.preventDefault();
                        saveHistory();
                        const step = 0.5; 
                        let newLeft = parseFloat(opt.style.left);
                        let newTop = parseFloat(opt.style.top);
                        if (e.code === 'ArrowLeft') newLeft -= step;
                        if (e.code === 'ArrowRight') newLeft += step;
                        if (e.code === 'ArrowUp') newTop -= step;
                        if (e.code === 'ArrowDown') newTop += step;
                        newLeft = parseFloat((Math.max(0, Math.min(100, newLeft))).toFixed(2));
                        newTop = parseFloat((Math.max(0, Math.min(100, newTop))).toFixed(2));
                        
                        if(opt.useKeyframes) addKeyframe(opt, {left: newLeft, top: newTop});
                        else {
                            const updatedOptions = activeNode.options.map(o => o.id === selectedOptionId ? { ...o, style: { ...o.style, left: newLeft, top: newTop } } : o);
                            updateNode(activeNode.id, 'options', updatedOptions);
                        }
                    }
                }
            };
            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [mode, selectedNodeId, selectedOptionId, activeNode, undo, redo, nodes, variables, startNodeId, duration, isImage, togglePlay, youtubeId]);

          useEffect(() => {
            setVideoError(null);
            setShowMissingFilesModal(false);
            if (mode === 'preview') {
                if (isTransitioning) {
                    const timer = setTimeout(() => setIsTransitioning(false), 100);
                    return () => clearTimeout(timer);
                }
            } else {
                setIsTransitioning(false);
            }
          }, [activeNodeId, mode]);

          // --- YOUTUBE API LOADER ---
          useEffect(() => {
              if (youtubeId && !window.YT) {
                  const tag = document.createElement('script');
                  tag.src = "https://www.youtube.com/iframe_api";
                  const firstScriptTag = document.getElementsByTagName('script')[0];
                  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
              }
          }, [youtubeId]);

          // --- MEDIA LOADING EFFECT ---
          useEffect(() => {
            if (isImage) {
                const imgDur = activeNode?.duration || 10;
                setDuration(imgDur);
                setVideoError(null);
                setShowMissingFilesModal(false);
                setIsPlaying(true); 
                setCurrentTime(0);
                if (ytPlayerRef.current && ytPlayerRef.current.destroy) { ytPlayerRef.current.destroy(); ytPlayerRef.current = null; }
            } else if (youtubeId) {
                const initYT = () => {
                    if (ytPlayerRef.current && ytPlayerRef.current.destroy) ytPlayerRef.current.destroy();
                    ytPlayerRef.current = new window.YT.Player('yt-player-container', {
                        videoId: youtubeId,
                        host: 'https://www.youtube-nocookie.com',
                        playerVars: { 
                            autoplay: mode === 'preview' ? 1 : 0, 
                            controls: 0, 
                            disablekb: 1,
                            rel: 0,
                            modestbranding: 1
                        },
                        events: {
                            onReady: (event) => {
                                setDuration(event.target.getDuration() || 10);
                                setVideoError(null);
                                if (mode === 'preview') event.target.playVideo();
                            },
                            onStateChange: (event) => {
                                setIsPlaying(event.data === window.YT.PlayerState.PLAYING);
                                if (event.data === window.YT.PlayerState.ENDED) handleAutoNavigation();
                            },
                            onError: (event) => {
                                setVideoError(`Error de YouTube (${event.data}). L'autor podria haver bloquejat la incrustació.`);
                            }
                        }
                    });
                };

                if (window.YT && window.YT.Player) {
                    initYT();
                } else {
                    window.onYouTubeIframeAPIReady = initYT;
                }
                setCurrentTime(0);
            } else if (videoRef.current && !youtubeId) {
                if (ytPlayerRef.current && ytPlayerRef.current.destroy) { ytPlayerRef.current.destroy(); ytPlayerRef.current = null; }
                
                const video = videoRef.current;
                const handleTimeUpdate = () => setCurrentTime(video.currentTime);
                const handleLoadedMetadata = () => {
                  if(video.videoWidth && video.videoHeight) setMediaAspectRatio(video.videoWidth / video.videoHeight);
                  if(video.duration && !isNaN(video.duration) && video.duration !== Infinity) setDuration(video.duration);
                  setVideoError(null); 
                  setShowMissingFilesModal(false);
                };
                const handleError = (e) => {
                    const error = e.target.error;
                    let msg = "No s'ha pogut carregar el vídeo.";
                    if (error) {
                        if (error.code === 4) { msg = "Vídeo no trobat. Enllaça els fitxers locals."; setShowMissingFilesModal(true); } 
                        else if (error.code === 3) msg = "Error de descodificació.";
                    }
                    setVideoError(msg); setIsPlaying(false);
                };

                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('loadedmetadata', handleLoadedMetadata);
                video.addEventListener('error', handleError);
                
                video.load();
                if (video.readyState >= 1) handleLoadedMetadata();
                if (mode === 'preview') {
                    video.play().catch(e => console.log("Autoplay blocked", e));
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                }
                setCurrentTime(0);

                return () => {
                  video.removeEventListener('timeupdate', handleTimeUpdate);
                  video.removeEventListener('loadedmetadata', handleLoadedMetadata);
                  video.removeEventListener('error', handleError);
                };
            }
          }, [activeNodeId, mode, activeNode?.videoUrl, youtubeId, isImage]); 

          useEffect(() => {
              if (isImage) setDuration(activeNode?.duration || 10);
          }, [activeNode?.duration, isImage]);

          useEffect(() => {
            if (mode === 'preview' && isImage && isPlaying && duration > 0 && currentTime >= duration) {
                setIsPlaying(false);
                handleAutoNavigation();
            }
          }, [currentTime, duration, isImage, isPlaying, mode]);

          const addVariable = () => {
            saveHistory();
            setVariables([...variables, { name: `var_${variables.length}`, type: 'number', value: 0 }]);
          };
          const updateVariable = (idx, field, val) => {
            saveHistory();
            const newVars = [...variables];
            newVars[idx][field] = val;
            setVariables(newVars);
          };
          const removeVariable = (idx) => {
            saveHistory();
            const newVars = variables.filter((_, i) => i !== idx);
            setVariables(newVars);
          };
          const checkCondition = (condition) => {
            if (!condition || !condition.variable) return true;
            const currentVal = runtimeVariables[condition.variable];
            const targetVal = parseFloat(condition.value);
            switch (condition.operator) {
              case 'eq': return currentVal == targetVal;
              case 'neq': return currentVal != targetVal;
              case 'gt': return currentVal > targetVal;
              case 'lt': return currentVal < targetVal;
              default: return true;
            }
          };
          const applyEffects = (effects) => {
            if (!effects) return;
            const newRuntime = { ...runtimeVariables };
            effects.forEach(eff => {
                if (!eff.variable) return;
                const currentVal = newRuntime[eff.variable] || 0;
                const effectVal = parseFloat(eff.value);
                if (eff.operator === 'set') newRuntime[eff.variable] = effectVal;
                if (eff.operator === 'add') newRuntime[eff.variable] = currentVal + effectVal;
                if (eff.operator === 'sub') newRuntime[eff.variable] = currentVal - effectVal;
            });
            setRuntimeVariables(newRuntime);
          };

          const handleSaveProject = () => {
            const projectData = { version: '2.0', timestamp: Date.now(), startNodeId, nodes, variables };
            const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `intervideo-project-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
          };
          const handleLoadProject = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (data.nodes) {
                  saveHistory();
                  setNodes(data.nodes);
                  if (data.startNodeId) setStartNodeId(data.startNodeId);
                  if (data.variables) setVariables(data.variables);
                  setSelectedNodeId(data.startNodeId || (data.nodes.length > 0 ? data.nodes[0].id : null));
                  setShowLoadModal(false);
                  alert("Projecte carregat!");
                }
              } catch (err) { alert("Error JSON"); }
            };
            reader.readAsText(file);
            e.target.value = ''; 
          };
          
          const handleExportZip = async () => {
             try {
                  const JSZip = await loadJSZip();
                  const zip = new JSZip();
                  const projectData = { version: '2.0', startNodeId, nodes, variables };
